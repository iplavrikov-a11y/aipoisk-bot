server {
    listen 80;
    server_name tenderlex.ru www.tenderlex.ru;

    client_max_body_size 120M;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.png {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /icon.png {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host tenderlex.ru;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host tenderlex.ru;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 https://tenderlex.ru$request_uri;
    }
}

server {
    listen 4443 ssl http2;
    port_in_redirect off;
    absolute_redirect off;
    server_name www.tenderlex.ru;

    ssl_certificate /etc/letsencrypt/live/tenderlex.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenderlex.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tenderlex.ru$request_uri;
}

server {
    listen 4443 ssl http2;
    port_in_redirect off;
    absolute_redirect off;
    server_name tenderlex.ru;

    client_max_body_size 120M;

    ssl_certificate /etc/letsencrypt/live/tenderlex.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenderlex.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
}
